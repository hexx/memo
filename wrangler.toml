name = "org-memo"
main = "src/server/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
# デプロイ先アカウント。識別子であり秘匿値ではない（ADR 0012）。
account_id = "f9992c5557a4b6f6a85c6f4220d19f07"

# AI によるタイトル自動生成（OpenAI 互換エンドポイント / @earendil-works/pi-ai）
# - AI_BASE_URL / AI_MODEL は非機密の設定値
# - AI_API_KEY はシークレットのため wrangler secret put で設定するか、
#   ローカル開発時は .dev.vars に記載（.gitignore 済み）
[vars]
AI_BASE_URL = "https://opencode.ai/zen/go/v1"
AI_MODEL = "deepseek-v4-flash"

[[d1_databases]]
binding = "DB"
database_name = "org-memo-db"
# 本番 D1 の実 UUID。識別子であり秘匿値ではない（ADR 0012）。
# Workers Builds の `d1 migrations apply --remote` と `wrangler deploy` がこの値を使う。
database_id = "bf349073-5d54-4c28-b2f7-0b54b3c0088c"

[assets]
directory = "./dist/client"

# ビルドは Workers Builds の build command（npm run build）が行う。
# ここに [build] を置くと wrangler deploy がもう一度ビルドする（二重ビルド）ため置かない。
# 手元から緊急反映する場合も `npm run build` を先に実行する（scripts/deploy-guard.mjs 参照）。
